name: Update Tofu Lockfile
'on':
  workflow_dispatch: null
jobs:
  lockfile-update:
    runs-on: ubuntu-latest
    steps:
    - uses: https://github.com/actions/checkout@v4
      with:
        token: ${{ secrets.PIPELINE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
    - uses: https://github.com/opentofu/setup-opentofu@v2
      with:
        tofu_version: 1.11.0
    - name: Update locks and open a checked pull request
      env:
        TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      run: |
        cd tofu
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail --silent --show-error -o shared-providers.tf "$GITHUB_SERVER_URL/api/v1/repos/romaine-life/infra-bootstrap/raw/tofu/provider/shared-providers.tf?ref=main"
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail --silent --show-error -o .terraform.lock.hcl "$GITHUB_SERVER_URL/api/v1/repos/romaine-life/infra-bootstrap/raw/tofu/provider/.terraform.lock.hcl?ref=main"
        tofu init -backend=false -lockfile=readonly
        cd ..
        if git diff --quiet; then exit 0; fi
        branch="FORGEJO-3-lockfile-$GITHUB_RUN_ID"
        git switch -c "$branch"
        git config user.name forgejo-actions
        git config user.email forgejo-actions@romaine.life
        git add tofu/.terraform.lock.hcl
        git commit -m "Refresh OpenTofu provider locks"
        git push origin "$branch"
        jq -n --arg head "$branch" '{head:$head,base:"main",title:"Refresh OpenTofu provider locks",body:"https://openproject.romaine.life/wp/FORGEJO-3"}' > /tmp/lock-pr.json
        printf 'header = "Authorization: token %s"\n' "$TOKEN" | curl --config - --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data-binary @/tmp/lock-pr.json "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls"
permissions:
  contents: write
  pull-requests: write
  id-token: write
